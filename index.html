<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jon Leyshon Coding Subscriptions</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body onLoad="getPrices(billingCycle)">
    <div class="pricing-page-container">
      <h1>Choose your plan</h1>
      <div class="pricing-toggle">
        <input
          type="radio"
          name="plan"
          value="month"
          id="month"
          onclick="getPrices('month')"
        /><label for="month">Monthly</label>
        <input
          type="radio"
          name="plan"
          value="year"
          id="year"
          onclick="getPrices('year')"
          checked
        /><label for="year">Yearly</label>
      </div>
      <div class="pricing-grid">
        <div class="starter-plan">
          <h3>Starter</h3>
          <p id="starter-price">£100.00</p>
          <p><small>per user</small></p>
          <button>Sign up now</button>
        </div>
        <div class="pro-plan">
          <h3>Pro</h3>
          <p id="pro-price">$300.00</p>
          <p><small>per user</small></p>
          <button>Sign up now</button>
        </div>
        <div class="enterprise-plan">
          <h3>Enterprise</h3>
          <p>Contact us</p>
          <p><small>bespoke pricing</small></p>
          <button>Inquire now</button>
        </div>
      </div>
    </div>
  </body>
  <script src="./script.js" type="text/javascript"></script>
</html>
