<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jon Leyshon Coding Subscriptions</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <script src="./script.js" type="text/javascript" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body onLoad="getPrices(billingCycle)">
   <!-- Pricing Container -->
   <div class="text-center text-4xl pt-20"> 
    <h1 class="font-bold pb-2">Jon Leyshon Coding</h1>
    <h2>
    Choose your membership
   </h2></div>
<div class="max-w-6xl mx-auto px-4 py-8">

    <!-- Billing Toggle -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center bg-gray-100 rounded-lg p-1">
        <button id="monthlyBtn" class="px-4 py-2 rounded-md text-sm bg-white" onclick="getPrices('month')">Monthly</button>
        <button id="yearlyBtn" class="px-4 py-2 rounded-md text-sm" onclick="getPrices('year')">Yearly (Save 20%)</button>
      </div>
    </div>
  
    <!-- Pricing Grid -->
    <div class="grid md:grid-cols-3 gap-8">
      <!-- Starter Plan -->
      <div class="bg-white rounded-lg shadow-lg p-8">
        <h3 class="text-xl font-semibold mb-4">Starter</h3>
        <div class="mb-4">
          <span id="starter-price" class="text-4xl font-bold">$10.00</span>
          <span class="text-gray-500 ml-1">/month</span>
        </div>
        <button onclick="openCheckout('starter')" class="w-full bg-green-500 text-white rounded-lg px-4 py-2 hover:bg-green-700 transition-colors">
          Get started
        </button>
      </div>
  
      <!-- Pro Plan -->
      <div class="bg-white rounded-lg shadow-lg p-8 border-2 border-green-500 relative">
        <div class="absolute -top-3 right-12 bg-green-500 text-white px-3 py-1 rounded-full text-sm">Popular</div>
        <h3 class="text-xl font-semibold mb-4">Pro</h3>
        <div class="mb-4">
          <span id="pro-price" class="text-4xl font-bold">$30.00</span>
          <span class="text-gray-500 ml-1">/month</span>
        </div>
        <button onclick="openCheckout('pro')" class="w-full bg-green-500 text-white rounded-lg px-4 py-2 hover:bg-green-700 transition-colors">
          Get started
        </button>
      </div>
  
      <!-- Enterprise Plan -->
      <div class="bg-white rounded-lg shadow-lg p-8">
        <h3 class="text-xl font-semibold mb-4">Enterprise</h3>
        <div class="mb-4">
          <span class="text-4xl font-bold">Contact us</span>
        </div>
        <button onclick="window.location.href='mailto:sales@example.com'" class="w-full bg-gray-600 text-white rounded-lg px-4 py-2 hover:bg-gray-700 transition-colors">
          Let's talk
        </button>
      </div>
    </div>
  </body>
  
</html>
